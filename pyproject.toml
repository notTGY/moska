[project]
name = "moska"
version = "0.0.3"
description = "A terminal orchestrator for local Codex agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph-sdk>=0.4.8",
    "langsmith>=0.14.11",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
moska = "main:main"

[tool.setuptools]
py-modules = ["main"]
package-dir = {"" = ".", adapters = "src/adapters", decomposer = "src/decomposer", orchestrator = "src/orchestrator", tui = "src/tui"}

[tool.setuptools.packages.find]
where = ["src"]
